<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" width="1000" height="460" role="img" aria-label="Event-driven image pixelation pipeline with AWS Lambda and S3" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
    <style>
      text { font-family: "Segoe UI", Helvetica, Arial, sans-serif; }
      .flow { fill: none; stroke: #475569; stroke-width: 2.5; stroke-dasharray: 8 6; animation: dash 0.9s linear infinite; }
      @keyframes dash { from { stroke-dashoffset: 14; } to { stroke-dashoffset: 0; } }
      .title { font-size: 15px; font-weight: 700; fill: #ffffff; }
      .sub { font-size: 11px; fill: #ffffff; opacity: 0.92; }
      .mono { font-family: "Consolas", "Courier New", monospace; font-size: 10px; fill: #ffffff; opacity: 0.95; }
      .lbl { font-size: 11px; fill: #334155; font-weight: 600; }
      .chip-t { font-size: 12px; font-weight: 700; fill: #0f172a; }
      .pulse { animation: pulse 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.035); } }
    </style>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="1000" height="460" rx="16" fill="#f8fafc" stroke="#e2e8f0"/>

  <!-- Original image -->
  <g filter="url(#shadow)">
    <rect x="30" y="160" width="130" height="90" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="48" y="172" width="94" height="52" rx="4" fill="#bae6fd"/>
    <circle cx="124" cy="187" r="7" fill="#fde047"/>
    <polygon points="48,224 78,194 98,212 114,200 142,224" fill="#16a34a"/>
    <text x="95" y="241" text-anchor="middle" font-size="11" font-weight="700" fill="#334155">Original Image</text>
  </g>

  <!-- S3 source -->
  <g filter="url(#shadow)">
    <rect x="240" y="160" width="150" height="90" rx="10" fill="#3f8624"/>
    <text x="315" y="188" text-anchor="middle" class="title">Amazon S3</text>
    <text x="315" y="206" text-anchor="middle" class="sub">Source Bucket</text>
    <text x="315" y="228" text-anchor="middle" class="mono">amc-image-pixelater-sec</text>
  </g>

  <!-- Lambda -->
  <g filter="url(#shadow)" class="pulse">
    <rect x="470" y="160" width="150" height="90" rx="10" fill="#ed7100"/>
    <text x="545" y="188" text-anchor="middle" class="title">AWS Lambda</text>
    <text x="545" y="206" text-anchor="middle" class="sub">Python 3.11</text>
    <text x="545" y="228" text-anchor="middle" class="mono">ImagePixelator</text>
  </g>

  <!-- Pillow package -->
  <g filter="url(#shadow)">
    <rect x="470" y="40" width="150" height="60" rx="10" fill="#fef3c7" stroke="#f59e0b"/>
    <text x="545" y="65" text-anchor="middle" font-size="13" font-weight="700" fill="#92400e">Pillow (PIL)</text>
    <text x="545" y="83" text-anchor="middle" font-size="11" fill="#92400e">ZIP package / Layer</text>
  </g>

  <!-- S3 processed -->
  <g filter="url(#shadow)">
    <rect x="700" y="160" width="170" height="90" rx="10" fill="#3f8624"/>
    <text x="785" y="188" text-anchor="middle" class="title">Amazon S3</text>
    <text x="785" y="206" text-anchor="middle" class="sub">Processed Bucket</text>
    <text x="785" y="228" text-anchor="middle" class="mono">amc-image-pixelater-proc</text>
  </g>

  <!-- CloudWatch -->
  <g filter="url(#shadow)">
    <rect x="470" y="320" width="150" height="70" rx="10" fill="#e7157b"/>
    <text x="545" y="348" text-anchor="middle" class="title">CloudWatch</text>
    <text x="545" y="367" text-anchor="middle" class="sub">Logs &amp; Monitoring</text>
  </g>

  <!-- Output group -->
  <rect x="650" y="300" width="330" height="110" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-dasharray="6 5"/>
  <text x="815" y="320" text-anchor="middle" class="lbl">5 Pixelated Images</text>
  <g>
    <rect x="662" y="332" width="54" height="54" rx="6" fill="#e0f2fe" stroke="#38bdf8"/>
    <text x="689" y="364" text-anchor="middle" class="chip-t">8×8</text>
    <rect x="725" y="332" width="54" height="54" rx="6" fill="#e0f2fe" stroke="#38bdf8"/>
    <text x="752" y="364" text-anchor="middle" class="chip-t">16×16</text>
    <rect x="788" y="332" width="54" height="54" rx="6" fill="#e0f2fe" stroke="#38bdf8"/>
    <text x="815" y="364" text-anchor="middle" class="chip-t">32×32</text>
    <rect x="851" y="332" width="54" height="54" rx="6" fill="#e0f2fe" stroke="#38bdf8"/>
    <text x="878" y="364" text-anchor="middle" class="chip-t">48×48</text>
    <rect x="914" y="332" width="54" height="54" rx="6" fill="#e0f2fe" stroke="#38bdf8"/>
    <text x="941" y="364" text-anchor="middle" class="chip-t">64×64</text>
  </g>

  <!-- Animated flow lines -->
  <path class="flow" d="M160,205 L238,205" marker-end="url(#arrow)"/>
  <path class="flow" d="M390,205 L468,205" marker-end="url(#arrow)"/>
  <path class="flow" d="M620,205 L698,205" marker-end="url(#arrow)"/>
  <path class="flow" d="M545,100 L545,158" marker-end="url(#arrow)"/>
  <path class="flow" d="M545,250 L545,318" marker-end="url(#arrow)"/>
  <path class="flow" d="M785,250 L785,298" marker-end="url(#arrow)"/>

  <!-- Line labels -->
  <text x="199" y="195" text-anchor="middle" class="lbl">Upload</text>
  <text x="429" y="195" text-anchor="middle" class="lbl">Event</text>
  <text x="659" y="195" text-anchor="middle" class="lbl">PutObject</text>
  <text x="595" y="135" class="lbl">Dependencies</text>
  <text x="560" y="290" class="lbl">Logs</text>

  <!-- Travelling dots -->
  <circle r="6" fill="#22c55e">
    <animateMotion dur="1.8s" repeatCount="indefinite" path="M160,205 L238,205"/>
  </circle>
  <circle r="6" fill="#22c55e">
    <animateMotion dur="1.8s" begin="0.4s" repeatCount="indefinite" path="M390,205 L468,205"/>
  </circle>
  <circle r="6" fill="#22c55e">
    <animateMotion dur="1.8s" begin="0.8s" repeatCount="indefinite" path="M620,205 L698,205"/>
  </circle>
  <circle r="6" fill="#22c55e">
    <animateMotion dur="1.8s" begin="1.2s" repeatCount="indefinite" path="M785,250 L785,298"/>
  </circle>
  <circle r="5" fill="#f59e0b">
    <animateMotion dur="1.6s" repeatCount="indefinite" path="M545,100 L545,158"/>
  </circle>

  <!-- Caption -->
  <text x="500" y="440" text-anchor="middle" font-size="17" font-weight="600" fill="#1e293b">Event-Driven Image Processing Pipeline with AWS Lambda and S3</text>
</svg>
